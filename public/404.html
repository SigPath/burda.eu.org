<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — sygnał utracony · Marcin Burda</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --paper:#F3F0E7; --ink:#181610; --ink2:#5A574B; --sig:#E8490C; --line:#D9D4C3; }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--paper); color: var(--ink);
      font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .box { max-width: 560px; width: 100%; border: 1px solid var(--ink); background: var(--paper); }
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--ink); padding: 10px 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink2);
    }
    .bar b { color: var(--sig); }
    .body { padding: 36px 28px 40px; }
    .code {
      font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-weight: 800;
      font-size: clamp(72px, 18vw, 128px); line-height: .9; letter-spacing: -.03em;
    }
    .code span { color: transparent; -webkit-text-stroke: 2px var(--ink); }
    h1 { font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-size: 22px; margin: 18px 0 10px; }
    p { color: var(--ink2); font-size: 15px; line-height: 1.65; max-width: 44ch; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    a {
      display: inline-block; padding: 12px 20px; border: 1px solid var(--ink);
      color: var(--ink); text-decoration: none;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    }
    a:hover { background: var(--ink); color: var(--paper); }
    a.primary { background: var(--ink); color: var(--paper); }
    a.primary:hover { background: var(--sig); border-color: var(--sig); }
    @media (prefers-reduced-motion: no-preference) {
      .trace { animation: sweep 2.4s linear infinite; }
      @keyframes sweep { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
    }
    .trace { height: 3px; background: var(--sig); opacity: .5; width: 40%; margin: 26px 0 0; }
  </style>
</head>
<body>
  <main class="box">
    <div class="bar"><span>CH·ERR / 404</span><b>● SYGNAŁ UTRACONY</b></div>
    <div class="body">
      <div class="code">4<span>0</span>4</div>
      <h1>Ten kanał nie istnieje</h1>
      <p>Adres, którego szukasz, nie odpowiada na zapytanie. Może przeniósł się na inną częstotliwość — wróć do strony głównej albo zajrzyj na GitHuba.</p>
      <div class="trace"></div>
      <div class="row">
        <a class="primary" href="/">Strona główna</a>
        <a href="https://github.com/SigPath">github.com/SigPath</a>
      </div>
    </div>
  </main>
</body>
</html>
