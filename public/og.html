<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>OG</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/bricolage-800-latin.woff2') format('woff2'); font-weight: 800; }
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/bricolage-800-latin-ext.woff2') format('woff2'); font-weight: 800; unicode-range: U+0100-024F; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-500-latin.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-500-latin-ext.woff2') format('woff2'); font-weight: 500; unicode-range: U+0100-024F; }
  @font-face { font-family: 'Instrument Sans'; src: url('/fonts/instrument-400-latin.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Instrument Sans'; src: url('/fonts/instrument-400-latin-ext.woff2') format('woff2'); font-weight: 400; unicode-range: U+0100-024F; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F3F0E7; color: #181610;
    font-family: 'Instrument Sans', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    border-block: 6px solid #181610;
  }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 34px 56px 0; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .14em; color: #5A574B; text-transform: uppercase; }
  .mid { padding: 0 56px; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 118px; line-height: .92; letter-spacing: -.02em; text-transform: uppercase;
  }
  h1 span { color: transparent; -webkit-text-stroke: 3px #181610; }
  .claim {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 33px; margin-top: 26px; max-width: 30ch; letter-spacing: -.01em;
  }
  .claim em { font-style: normal; color: #E8490C; }
  .wave { margin: 26px 0 0; display: block; }
  .bottom { display: flex; gap: 14px; padding: 0 56px 40px; flex-wrap: wrap; }
  .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: .1em;
    text-transform: uppercase; border: 1.5px solid #181610; padding: 8px 16px;
  }
  .tag.solid { background: #181610; color: #F3F0E7; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <svg width="52" height="36" viewBox="0 0 26 18"><path d="M1 17V4h7v9h5V1h7v12h5" fill="none" stroke="#E8490C" stroke-width="2.4"/></svg>
      <span class="mono">SIG·LAB — BURDA.EU.ORG</span>
    </div>
    <span class="mono">CH·01 — PORTFOLIO</span>
  </div>
  <div class="mid">
    <h1>MARCIN<br><span>BURDA</span></h1>
    <p class="claim">Narzędzia AI i automatyzacje, które pracują na <em>realnych danych</em>.</p>
    <svg class="wave" width="1088" height="74" viewBox="0 0 1088 74" fill="none">
      <path d="M0 40 C 40 10, 80 10, 120 40 S 200 70, 240 40 S 320 10, 360 40 S 440 70, 480 40 S 560 10, 600 40 S 680 70, 720 40 S 800 10, 840 40 S 920 70, 960 40 S 1040 10, 1088 40" stroke="#E8490C" stroke-width="3"/>
      <path d="M0 44 C 60 24, 120 24, 180 44 S 300 64, 360 44 S 480 24, 540 44 S 660 64, 720 44 S 840 24, 900 44 S 1020 64, 1088 44" stroke="#181610" stroke-width="2.5"/>
      <path d="M0 36 C 90 56, 180 16, 270 36 S 450 56, 540 36 S 720 16, 810 36 S 990 56, 1088 36" stroke="#2E45D8" stroke-width="2" opacity=".65"/>
    </svg>
  </div>
  <div class="bottom">
    <span class="tag solid">AI ENGINEERING</span>
    <span class="tag">AUTOMATYZACJA</span>
    <span class="tag">LOKALNE LLM</span>
    <span class="tag" style="margin-left:auto; border-color:#5A574B; color:#5A574B;">BURDA.EU.ORG</span>
  </div>
</body>
</html>
